<div id="lightbox" class="lightbox" aria-hidden="true" onclick="closePhoto(event)"><button class="lightbox-close" type="button" aria-label="Agħlaq" onclick="closePhoto(event)">×</button><img id="lightbox-img" alt="Ritratt imkabbar"></div>
<script>
function openPhoto(src){const b=document.getElementById('lightbox');document.getElementById('lightbox-img').src=src;b.classList.add('show');b.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closePhoto(e){if(e && e.target.id==='lightbox-img')return;const b=document.getElementById('lightbox');b.classList.remove('show');b.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto(e)});
</script>
